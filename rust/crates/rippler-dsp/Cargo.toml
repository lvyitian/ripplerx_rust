[package]
name = "rippler-dsp"
description = "Pure DSP core for the RipplerX physical modelling synthesiser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nice-plug-core = { version = "0.4", default-features = false, optional = true }
symphonia = { version = "0.5", default-features = false, features = ["flac", "wav", "aiff", "pcm", "mp3"] }

[features]
default = []
params = ["dep:nice-plug-core"]
