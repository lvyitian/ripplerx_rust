[package]
name = "xtask"
description = "The build tasks of the RipplerX plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
cargo_metadata = "0.23"
nice-plug = { version = "0.4", default-features = false, features = ["vst3"] }
nice-plug-xtask = "0.1.1"
rippler-plugin = { path = "../crates/rippler-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
