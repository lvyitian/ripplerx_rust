[workspace]
resolver = "3"
members = [
    "crates/rippler-dsp",
    "crates/rippler-params",
    "crates/rippler-plugin",
]

[workspace.dependencies]
rippler-dsp = { path = "crates/rippler-dsp" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/tiagolr/ripplerx"
