[package]
name = "rippler-plugin"
description = "The RipplerX audio plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
mts-client-rs = "0.1.0"
nice-plug = { version = "0.4", default-features = false, features = ["editor", "vst3"] }
nice-plug-core = { version = "0.4", default-features = false, features = ["editor"] }
nice-plug-egui = "0.6"
rfd = "0.18"
rippler-dsp = { workspace = true }
rippler-params = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
