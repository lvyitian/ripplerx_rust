name: Release

# This workflow builds the JUCE implementation, which is the reference for the
# Rust port in `rust/`. Tagged releases are produced by `rust.yml` instead, so
# that there is exactly one release per tag.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
         submodules: recursive

      - name: Generate Build Files
        run: |
          cmake -G "Visual Studio 17 2022" -DBUILD_STANDALONE=OFF -DCMAKE_BUILD_TYPE=Release -S . -B ./build

      - name: Build Project
        run: |
         cmake --build ./build --config Release

      - name: List errors
        run: |
          if exist .\build\CMakeFiles\CMakeError.log type .\build\CMakeFiles\CMakeError.log
        shell: cmd

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ripplerx-win
          path: |
            ./build/RipplerX_artefacts/Release/LV2
            ./build/RipplerX_artefacts/Release/VST3
            !./build/RipplerX_artefacts/Release/VST3/*.exp
            !./build/RipplerX_artefacts/Release/VST3/*.lib
            !./build/RipplerX_artefacts/Release/LV2/*.exp
            !./build/RipplerX_artefacts/Release/LV2/*.lib

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
         submodules: recursive

      - name: Uninstall existing cmake (if any)
        run: brew uninstall cmake || true

      - name: Install Dependencies
        run: brew install cmake

      - name: Generate Build Files
        run: |
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_STANDALONE=OFF -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -S . -B ./build

      - name: Build Project
        run: |
         cmake --build ./build --config Release

      - name: Copy readme
        run: |
          cp ./doc/macos-readme.txt ./build/RipplerX_artefacts/Release/readme.txt

      - name: List errors
        run: cat "./build/CMakeFiles/CMakeError.log" || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ripplerx-macos
          path: |
            ./build/RipplerX_artefacts/Release/LV2
            ./build/RipplerX_artefacts/Release/AU
            ./build/RipplerX_artefacts/Release/VST3
            ./build/RipplerX_artefacts/Release/readme.txt
            !./build/RipplerX_artefacts/Release/VST3/*.exp
            !./build/RipplerX_artefacts/Release/VST3/*.lib

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
         submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt-get install libx11-dev libfreetype-dev libfontconfig1-dev libasound2-dev libxrandr-dev libxinerama-dev libxcursor-dev

      - name: Generate Build Files
        run: |
          cmake -G "Unix Makefiles" -DBUILD_STANDALONE=OFF -DCMAKE_BUILD_TYPE=Release -S . -B ./build

      - name: Build Project
        run: |
         cmake --build ./build --config Release

      - name: List errors
        run: cat "./build/CMakeFiles/CMakeError.log" || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ripplerx-linux
          path: |
            ./build/RipplerX_artefacts/Release/LV2
            ./build/RipplerX_artefacts/Release/VST3
            !./build/RipplerX_artefacts/Release/VST3/*.exp
            !./build/RipplerX_artefacts/Release/VST3/*.lib
