name: Rust

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# A new push to a ref cancels the run that was already going for it, rather
# than building the same thing twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: ripplerx-rust-win
          - os: ubuntu-22.04
            artifact: ripplerx-rust-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install the system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libasound2-dev

      - name: Install the toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install nightly --component clippy,rustfmt

      - name: Cache the cargo registry and the bundler
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ matrix.os }}-cargo-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run the tests
        run: cargo test --all

      - name: Build and bundle
        # The xtask bundles the plugin and writes the VST3 module information
        # file, which the JUCE build also ships.
        run: cargo xtask bundle -p rippler-plugin --release

      - name: Build a universal bundle
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo xtask bundle-universal -p rippler-plugin --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: rust/target/bundled/*

  build-macos:
    # GitHub's macOS runners are physical machines with far less capacity than
    # the virtualised Linux and Windows ones, so this job regularly cannot get
    # a runner and is cancelled after fifteen minutes. It must not hold up the
    # release, but the release still waits for it so that a macOS build which
    # does get a runner is included.
    #
    # Only the tagged release needs a macOS build, so it is not run for the
    # ordinary master builds. That keeps the scarce runners for when they
    # matter.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install nightly --component clippy,rustfmt

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run the tests
        run: cargo test --all

      - name: Build and bundle
        run: cargo xtask bundle -p rippler-plugin --release

      - name: Build a universal bundle
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo xtask bundle-universal -p rippler-plugin --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ripplerx-rust-macos
          path: rust/target/bundled/*

  release:
    runs-on: ubuntu-latest
    needs: [build, build-macos]
    # Creating the release needs write access to the repository contents.
    permissions:
      contents: write
    # `always()` so that a macOS job cancelled for lack of runner capacity
    # cannot skip the release, but the release still requires the Windows and
    # Linux builds to have succeeded.
    if: >-
      always()
      && needs.build.result == 'success'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download the Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ripplerx-rust-win
          path: artifacts/ripplerx-rust-win

      - name: Download the macOS artifact
        uses: actions/download-artifact@v4
        # The macOS build can fail for want of runner capacity, in which case
        # there is no artifact to download and the release goes out without it.
        continue-on-error: true
        with:
          name: ripplerx-rust-macos
          path: artifacts/ripplerx-rust-macos

      - name: Download the Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ripplerx-rust-linux
          path: artifacts/ripplerx-rust-linux

      - name: Zip each platform's artifacts
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          cd artifacts
          zip -r ripplerx-rust-win-${TAG_NAME}.zip ripplerx-rust-win
          zip -r ripplerx-rust-linux-${TAG_NAME}.zip ripplerx-rust-linux
          if [ -d ripplerx-rust-macos ]; then
            zip -r ripplerx-rust-macos-${TAG_NAME}.zip ripplerx-rust-macos
          fi

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/ripplerx-rust-win-*.zip
            artifacts/ripplerx-rust-linux-*.zip
            artifacts/ripplerx-rust-macos-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
