[workspace]
resolver = "3"
members = [
    "crates/rippler-dsp",
    "crates/rippler-params",
    "crates/rippler-plugin",
    "xtask",
]

[workspace.dependencies]
rippler-dsp = { path = "crates/rippler-dsp" }
rippler-params = { path = "crates/rippler-params" }

[workspace.package]
version = "1.6.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/lvyitian/ripplerx_rust"
